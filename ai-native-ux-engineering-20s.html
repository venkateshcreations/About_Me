  const s=(u*.9)%1;circ(lerp(dx,ex,s),lerp(dy,ey,s),9*Math.max(ck,0),C.navy);
  cursor(dx,dy,C.pink,'Design',Math.max(ck,0));cursor(ex,ey,C.blue,'Engineering',Math.max(ck,0));
}

const S=[0,2.6,5.6,8.4,11.2,14.0,15.8,18.0,20],F=[s1,s2,s3,s4,s5,s6,s7,s8],ORG=[[960,540],[1920,0],[0,1080],[1920,1080],[960,540],[0,0],[1920,540],[960,1080]];
